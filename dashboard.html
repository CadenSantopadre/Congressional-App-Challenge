<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - FlightTally</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="dashboard-layout">
    <sidebar class="sidebar">
        <h2>FlightTally</h2>
        <sidenav>
            <button id="aircraftButton" class="active">Aircraft</button>
            <button id="checklistButton">Checklists</button>
            <button id="flightButton">Flights</button>
        </sidenav>
    </sidebar>

<!--Start of airframes page-->
<div id="aircraftDiv" class="active main-container">
    <main class="content">
        <header class="content-header">
            <h1>Aircraft</h1>
            <button id="openAdd">+ New Aircraft</button>
            <hr>
        </header>

        <div id="aircraftGrid" class="aircraft-grid"></div>
    </main>
</div>

<!--Add aircraft modal-->
<div id="addAircraftModal" class="modal">
    <div class="modal-content">
        <button type="button" id="closeBtn">X</button>
        <h2>Add New Aircraft</h2>
        <form id="aircraftForm">
            <input type="text" placeholder="Plane Name" name="name-input" required>
            <input type="text" placeholder="Tail Number" name="tail-input" required>
            <input type="number" placeholder="Flight Hours" name="hour-input">
            <button type="submit">Add Plane</button>
        </form>
    </div>
</div>
<!--Edit modal-->
<div id="editAircraftModal" class="modal">
  <div class="modal-content">
    <span id="closeEditBtn" style="cursor:pointer;">&times;</span>
        <h2>Edit Aircraft</h2>
        <p>Leave everything blank to delete it</p>
        <form id="editAircraftForm">
            <input type="text" name="edit-tail-input">
            <input type="text" name="edit-name-input">
            <input type="number" name="edit-hour-input">
            <button type="submit">Save Changes</button>
        </form>
  </div>
</div>

<!--Start of Checklists Page-->
<div id="checklistDiv" class="hidden main-container">
    <main class="content">
        <header class="content-header">
            <h1>Checklists</h1>
            <hr>
        </header>
        <div id="checklistGrid" class="aircraft-grid"></div>
    </main>
</div>

<!--Start of Flights Page-->
<div id="flightDiv" class="hidden main-container">
    <main class="content">
        <header class="content-header">
            <h1>Flights</h1>
            <hr>
        </header>
        <button id="addFlight">+ Add Flight</button>
        <div id="flightGrid" class="aircraft-grid"></div>
    </main>
</div>
<!--Add Flight Modal-->
<div id="addFlightModal" class="modal">
    <div class="modal-content">
        <button type="button" id="closeFlightBtn">X</button>
        <h2>Add New Flight</h2>
        <form id="flightForm">
            <select name="Planes" id="planeDrop"></select>
            <input type="date" placeholder="Date" name="date-input">
            <input type="text" placeholder="ORIG" name="origin-input">
            <input type="text" placeholder="DEST" name="dest-input">
            <input type="number" placeholder="Flight Hours" name="hour-input">
            <select name="Command" id="commandDrop">
                <option value="PIC">PIC</option>
                <option value="SIC">SIC</option>
                <option value="Dual">Dual Receieved</option>
            </select>
            <select name="Time" id="timeDrop">
                <option value="DAY">DAY</option>
                <option value="NIGHT-full">NIGHT (Full Stop)</option>
                <option value="NIGHT-touch">NIGHT (Touch-And-Go)</option>
            </select>
            <button type="submit">Log Flight</button>
        </form>
    </div>
</div>

</body>
<script src="dashboard-script.js"></script>
</html>
