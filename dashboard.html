<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - FlightTally</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="dashboard-layout">
    <sidebar class="sidebar">
        <h2>FlightTally</h2>
        <sidenav>
            <button id="aircraftButton" class="active">Aircraft</button>
            <button id="checklistButton">Checklists</button>
            <button id="flightButton">Flights</button>
            <button id="maintenanceButton">Maintenance</button>
        </sidenav>
    </sidebar>

<!--Start of airframes page-->
<div id="aircraftDiv" class="active main-container">
    <main class="content">
        <header class="content-header">
            <h1>Aircraft</h1>
            <button id="openAdd">+ New Aircraft</button>
            <hr>
        </header>

        <div id="aircraftGrid" class="aircraft-grid"></div>
    </main>
</div>

<!--Add aircraft modal-->
<div id="addAircraftModal" class="modal">
    <div class="modal-content">
        <button type="button" id="closeBtn">X</button>
        <h2>Add New Aircraft</h2>
        <form id="aircraftForm">
            <input type="text" placeholder="Plane Name" name="name-input" required>
            <input type="text" placeholder="Tail Number" name="tail-input" required>
            <input type="number" placeholder="Tach Time" name="tach-input" required>
            <input type="number" placeholder="Hobbs Time" name="hobbs-input" required>
            <button type="submit">Add Plane</button>
        </form>
    </div>
</div>
<!--Edit modal-->
<div id="editAircraftModal" class="modal">
  <div class="modal-content">
    <span id="closeEditBtn" style="cursor:pointer;">&times;</span>
        <h2>Edit Aircraft</h2>
        <p>Leave everything blank to delete it</p>
        <form id="editAircraftForm">
            <input type="text" name="edit-tail-input">
            <input type="text" name="edit-name-input">
            <input type="number" placeholder="Tach Time" name="edit-tach-input" >
            <input type="number" placeholder="Hobbs Time" name="edit-hobbs-input">
            <button type="submit">Save Changes</button>
        </form>
  </div>
</div>

<!--Start of Checklists Page-->
<div id="checklistDiv" class="hidden main-container">
    <main class="content">
        <header class="content-header">
            <h1>Checklists</h1>
            <hr>
        </header>
        <div id="checklistGrid" class="aircraft-grid"></div>
    </main>
</div>

<!--Start of Flights Page-->
<div id="flightDiv" class="hidden main-container">
    <main class="content">
        <header class="content-header">
            <h1>Flights</h1>
            <button id="addFlight">+ Add Flight</button>
            <hr>
        </header>
        <div id="flightGrid" class="aircraft-grid"></div>
    </main>
</div>
<!--Add Flight Modal-->
<div id="addFlightModal" class="modal">
  <div class="modal-content">
    <button type="button" id="closeFlightBtn">X</button>
    <h2>Add New Flight</h2>
    <form id="flightForm">
      <select name="Planes" id="planeDrop"></select>
      <input type="date" placeholder="Date" name="date-input">
      <input type="text" placeholder="ORIG" name="origin-input">
      <input type="text" placeholder="DEST" name="dest-input">

        <div class="input-row">
            <input type="number" placeholder="Starting Hobbs Time" name="hobbs-start" class="hobbs-tach">
            <input type="number" placeholder="Ending Hobbs Time" name="hobbs-end" class="hobbs-tach">
        </div>

        <div class="input-row">
            <input type="number" placeholder="Starting Tach Time" name="tach-start" class="hobbs-tach">
            <input type="number" placeholder="Ending Tach Time" name="tach-end" class="hobbs-tach">
        </div>

      
      <select name="Command" id="commandDrop">
        <option value="PIC">PIC</option>
        <option value="SIC">SIC</option>
        <option value="Dual">Dual Receieved</option>
      </select>
      
      <select name="Time" id="timeDrop">
        <option value="DAY">DAY</option>
        <option value="NIGHT-full">NIGHT (Full Stop)</option>
        <option value="NIGHT-touch">NIGHT (Touch-And-Go)</option>
      </select>

      <details class="ifr-details">
        <summary>IFR Details</summary>
        <div class="ifr-fields">
            <input type="number" name="approaches-count" min="0" placeholder="Approach Count">
          
            <select name="approach-type" id="approachType">
                <option value="ILS">ILS</option>
                <option value="RNAV">RNAV (GPS)</option>
                <option value="VOR">VOR</option>
                <option value="LOC">LOC</option>
                <option value="NDB">NDB</option>
                <option value="LDA">LDA / SDF</option>
            </select>
            
            <label>Holds Logged?
            <input type="checkbox" name="holds-logged">
            </label>

            <br>

            <label>Intercept Course?
            <input type="checkbox" name="intercept">
            </label>
        </div>
      </details>

      <button type="submit">Log Flight</button>
    </form>
  </div>
</div>

<!--Start of maintenance div-->
<div id="maintenanceDiv" class="hidden main-container">
    <main class="content">
        <header class="content-header">
            <h1>Maintenance</h1>
            <button id="addMaintBtn">Add Custom Tracker</button>
            <hr>
        </header>
        <div id="maintenanceGrid" class="aircraft-grid"></div>
    </main>
</div>

<!--Start of maintenace Modal-->
<div id="addMaintenanceModal" class="modal">
  <div class="modal-content">
    <button type="button" id="closeMaintBtn">X</button>
    <h2>Add Maintenance Item</h2>
    <form id="maintenanceForm">
        <select name="Planes" id="maintPlaneDrop"></select>

        <input type="text" placeholder="Description" name="maint-description">

        <select name="interval-type" id="intervalTypeDrop">
            <option value="hours">Hours-Based</option>
            <option value="calendar">Calendar-Based</option>
        </select>

        <select name="hour-source" id="hourSourceDrop" class="hours-field">
            <option value="flightHours">Flight Hours (Hobbs)</option>
            <option value="tach">Tach Time</option>
        </select>

        <input type="number" placeholder="Interval Value (hrs or months)" name="interval-value" required>

        <input type="number" placeholder="Tach at Last Done" name="last-done-hours" class="hours-field">
        <input type="date" placeholder="Date Last Done" name="last-done-date" class="calendar-field">

        <button type="submit">Add Item</button>
    </form>
    </div>
</div>

</body>
<script src="dashboard-script.js"></script>
</html>
